<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Profile — Auth0 SSEC Demo</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Auth0 SSEC Demo</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/profile}">Profile</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/sso-setup}">SSO Setup Link</a>
        </li>
        <li class="nav-item">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light ms-2">Logout</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1 class="h3 mb-4">ID Token Claims</h1>
  <p class="text-muted mb-4">
    These claims come from the Auth0 ID token. Note <code>org_id</code> —
    it is required to generate an SSO setup link.
  </p>

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th scope="col">Claim</th>
          <th scope="col">Value</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="entry : ${claims}">
          <td>
            <code th:text="${entry.key}"></code>
          </td>
          <td th:text="${entry.value}" class="text-break"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <a th:href="@{/sso-setup}" class="btn btn-primary mt-3">Generate SSO Setup Link</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmBrMFCB/YTeiYo1G+02pkFyTgl6"
        crossorigin="anonymous"></script>
</body>
</html>
