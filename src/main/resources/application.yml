server:
  port: 8080

# Spring Security OAuth2 Client config (Auth0 via native OIDC)
# Login URL:    /oauth2/authorization/okta
# Callback URL: /login/oauth2/code/okta
spring:
  security:
    oauth2:
      client:
        registration:
          okta:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope: openid,profile,email
        provider:
          okta:
            issuer-uri: https://${AUTH0_DOMAIN}/

# M2M credentials used for Management API calls (SSEC endpoints)
auth0:
  domain: ${AUTH0_DOMAIN}
  mgmt-client-id: ${AUTH0_MGMT_CLIENT_ID:}
  mgmt-client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}
  client-id: ${AUTH0_CLIENT_ID}
